version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CHECKPOINT_PATH=/app/model.pth
    volumes:
      - ./outputs:/app/outputs:ro
      # Mount your trained checkpoint here, e.g.:
      # - ./outputs/vit_grit_latest.pth:/app/model.pth:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
